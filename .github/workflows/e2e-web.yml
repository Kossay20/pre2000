name: E2E Web (Playwright)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Empêche deux runs E2E simultanés sur la même branche (runner se marche dessus
# sur le port 8081 + ressources système). Les anciens runs sont annulés.
concurrency:
  group: e2e-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-web:
    name: Playwright smoke (chromium, Expo web)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    defaults:
      run:
        working-directory: ./app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Cache des navigateurs Playwright entre runs.
      # Clé = version Playwright extraite du lockfile (change si on bump @playwright/test).
      - name: Get Playwright version
        id: pw-version
        run: |
          VERSION=$(node -e "console.log(require('./node_modules/@playwright/test/package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers (chromium + deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system deps (cache hit case — chromium binary cached but apt deps not)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # `playwright.config.ts` démarre Expo automatiquement via `webServer:`
      # (`reuseExistingServer:false` quand CI=true). Pas besoin de step Expo séparée.
      - name: Run Playwright tests
        run: npm run e2e:web
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 14

      - name: Upload test-results (traces + videos + screenshots on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: app/test-results/
          retention-days: 14
